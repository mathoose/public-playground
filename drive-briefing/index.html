<!DOCTYPE html>
<!-- build: drive-briefing-v2 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e3a5f" />
  <title>Drive briefing · Oct 6, 2026</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --ink: #f4f6fa;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --line: #2d3a4f;
      --tap: 52px;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse 140% 90% at 50% -10%, #1e3a5f 0%, var(--bg) 50%);
      color: var(--ink);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      padding: calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 12px);
    }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .back {
      display: inline-flex;
      align-items: center;
      min-height: var(--tap);
      font-size: 16px;
      flex-shrink: 0;
    }
    header {
      flex-shrink: 0;
      padding: 8px 0 16px;
    }
    header h1 {
      font-size: clamp(1.5rem, 5.5vw, 1.85rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .date {
      color: var(--muted);
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-weight: 500;
      margin: 0;
    }
    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      padding: 12px 0 20px;
      min-height: 0;
    }
    #playBig {
      width: 100%;
      min-height: clamp(88px, 22vh, 120px);
      border: 0;
      border-radius: 24px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #0c1220;
      font: inherit;
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(56, 189, 248, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    #playBig:active { transform: scale(0.985); }
    #playBig.playing {
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
      box-shadow: none;
    }
    .speed {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
    }
    .speed button {
      font: inherit;
      font-size: clamp(0.95rem, 3.8vw, 1.05rem);
      font-weight: 700;
      padding: 0 4px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      min-height: var(--tap);
      -webkit-tap-highlight-color: transparent;
    }
    .speed button.on {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 18%, var(--card));
      color: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    audio {
      width: 100%;
      min-height: 44px;
      flex-shrink: 0;
    }
    .hint {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
      flex-shrink: 0;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding-top: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <a class="back" id="hubLink" href="../project-hub/" data-htmlpreview="https://htmlpreview.github.io/?https://github.com/mathoose/public-playground/blob/main/project-hub/index.html">← Project Hub</a>

    <header>
      <h1>Drive briefing</h1>
      <p class="date">October 6, 2026</p>
    </header>

    <div class="player">
      <button type="button" id="playBig" aria-controls="briefing">▶ Play</button>
      <div class="speed" aria-label="Playback speed">
        <button type="button" data-rate="1">1×</button>
        <button type="button" data-rate="1.5">1.5×</button>
        <button type="button" data-rate="2" class="on">2×</button>
        <button type="button" data-rate="2.5">2.5×</button>
        <button type="button" data-rate="3">3×</button>
      </div>
      <audio id="briefing" controls preload="metadata" playsinline src="./latest.mp3">
        Your browser does not support audio playback.
      </audio>
      <p class="hint" id="autoplayNote">Tap Play once. On iPhone, sound needs a tap even with <code>?autoplay=1</code>.</p>
    </div>

    <footer id="footer">Drive briefing v2 · Oct 6, 2026</footer>
  </div>

  <script>
    (function () {
      var APP_VERSION = "2 · Oct 6, 2026";
      var audio = document.getElementById("briefing");
      var playBig = document.getElementById("playBig");
      var hub = document.getElementById("hubLink");
      var DEFAULT_RATE = 2;

      if (location.hostname.indexOf("htmlpreview") !== -1 || location.protocol === "file:") {
        var hp = hub.getAttribute("data-htmlpreview");
        if (hp) hub.href = hp;
      }

      function setPlaying(on) {
        playBig.classList.toggle("playing", on);
        playBig.textContent = on ? "⏸ Pause" : "▶ Play";
      }

      function setRate(rate) {
        audio.playbackRate = rate;
        document.querySelectorAll(".speed button").forEach(function (b) {
          b.classList.toggle("on", parseFloat(b.getAttribute("data-rate"), 10) === rate);
        });
      }

      playBig.addEventListener("click", function () {
        if (audio.paused) {
          audio.play().catch(function () {
            document.getElementById("autoplayNote").textContent =
              "Playback blocked — use the controls below, then tap Play again.";
          });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", function () { setPlaying(true); });
      audio.addEventListener("pause", function () { setPlaying(false); });
      audio.addEventListener("ended", function () { setPlaying(false); });

      document.querySelectorAll(".speed button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setRate(parseFloat(btn.getAttribute("data-rate"), 10));
        });
      });
      setRate(DEFAULT_RATE);

      if (/[?&]autoplay=1/.test(location.search)) {
        audio.play().catch(function () {
          document.getElementById("autoplayNote").textContent =
            "Autoplay blocked on this device — tap Play.";
        });
      }

      document.getElementById("footer").textContent = "Drive briefing v" + APP_VERSION;
    })();
  </script>
</body>
</html>
